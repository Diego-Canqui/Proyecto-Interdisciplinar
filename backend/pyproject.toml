[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prestamos-recursos"
version = "0.1.0"
description = "Sistema de Gestión de Préstamos de Recursos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: tests unitarios (lógica pura dominio, sin BD)",
    "integration: tests de integración (servicios + repos con BD real, requieren Docker)",
    "e2e: tests end-to-end (endpoints HTTP, auth, rate limit, requieren Docker)",
]

[tool.ruff]
line-length = 100
src = ["src"]
